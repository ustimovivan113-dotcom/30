version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: lms_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  redis:
    image: redis:7-alpine
    container_name: lms_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data

  backend:
    build: .
    container_name: lms_backend
    restart: always
    env_file:
      - .env
    ports:
      - "${DJANGO_PORT}:8000"
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: lms_celery_worker
    restart: always
    env_file:
      - .env
    command: celery -A lms_project worker -l info --pool=solo
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  celery-beat:
    build: .
    container_name: lms_celery_beat
    restart: always
    env_file:
      - .env
    command: celery -A lms_project beat -l info
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - celery

volumes:
  postgres_data:
  redis_data: